<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組化手臂測試</title>
<style>
    :root { --bg:#11111b; --panel:#1e1e2e; --line:#45475a; --text:#cdd6f4; --sub:#a6adc8; --accent:#f9e2af; --ok:#a6e3a1; --bad:#f38ba8; --field:#313244; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Noto Sans TC", sans-serif; font-size:13px; overflow:hidden; }
    #view { position:fixed; inset:0; }
    #panel { position:fixed; top:10px; left:10px; bottom:10px; width:330px; max-width:calc(100vw - 20px); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; overflow-y:auto; }
    h2 { font-size:15px; margin:0 0 4px; color:var(--accent); }
    h3 { font-size:13px; margin:14px 0 6px; color:var(--accent); border-top:1px solid var(--line); padding-top:10px; }
    .note { color:var(--sub); font-size:11px; line-height:1.5; }
    select, input[type=number] { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 4px; font-size:12px; }
    button { background:var(--accent); color:#111; border:none; border-radius:6px; padding:6px 10px; font-weight:bold; cursor:pointer; font-size:12px; }
    button.ghost { background:var(--field); color:var(--text); border:1px solid var(--line); font-weight:normal; }
    .row { display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap:wrap; }
    .card { display:flex; align-items:center; gap:6px; background:var(--field); border:1px solid var(--line); border-radius:6px; padding:4px 6px; margin-bottom:3px; }
    .card .idx { color:var(--sub); font-size:11px; width:18px; }
    .card .name { flex:1; }
    .card .x { background:transparent; color:var(--bad); border:none; padding:2px 6px; font-size:14px; }
    .card.base { opacity:0.75; }
    .tag { font-size:10px; padding:1px 5px; border-radius:8px; margin-right:4px; }
    .tag.m { background:#bac2de; color:#111; } .tag.c { background:#cba6f7; color:#111; } .tag.e { background:#94e2d5; color:#111; }
    #nextBox { margin-top:8px; padding:8px; border:1px dashed var(--accent); border-radius:6px; }
    #nextBtns { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
    #nextBtns button:disabled { opacity:0.35; cursor:not-allowed; }
    .slider { margin-bottom:4px; }
    .slider .lbl { display:flex; justify-content:space-between; }
    .slider input { width:100%; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
    .grid3 input { width:100%; }
    #readout, #ikResult { font-family: ui-monospace, Consolas, monospace; font-size:11.5px; line-height:1.55; white-space:pre-wrap; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    #collBadge { position:fixed; top:12px; right:12px; padding:6px 12px; border-radius:8px; font-weight:bold; font-size:13px; z-index:4; }
    #collBadge.safe { background:#1e1e2e; color:var(--ok); border:1px solid var(--ok); }
    #collBadge.hit { background:var(--bad); color:#111; }
    #toggle { display:none; position:fixed; top:10px; right:10px; z-index:5; }
    @media (max-width: 600px) { #collBadge { top:auto; bottom:12px; } #panel { top:52px; width:auto; right:10px; bottom:auto; max-height:55vh; } #toggle { display:block; } #panel.hidden { display:none; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="collBadge"></div>
<button id="toggle" class="ghost">面板</button>
<div id="panel">
    <h2>模組化手臂測試頁</h2>
    <div class="note">純模擬,不會連線、不會送指令給硬體。黃色箭頭 = 每顆馬達的轉軸方向。</div>
    <div class="row" style="margin-top:6px;">
        <label><input id="showModels" type="checkbox" checked> 顯示 3D 模型</label>
        <label><input id="showBoxes" type="checkbox"> 顯示碰撞盒</label>
    </div>
    <div id="loadInfo" class="note"></div>

    <h3>1. 組裝</h3>
    <div class="note">從底座開始,一個一個往上接。每接一個,下面就會列出下一個可以接的零件;連接件可以連續接,馬達也可以直接接馬達。橘色圓環 = 下一個零件會接的位置。</div>
    <div class="row" style="margin-top:6px;"><button id="presetCurrent" class="ghost">載入目前實體手臂</button><button id="presetScara" class="ghost">載入 SCARA</button><button id="clearBtn" class="ghost">清空重來</button></div>
    <div id="chain"></div>
    <div id="nextBox">
        <div id="nextHint" class="note"></div>
        <div id="nextBtns"></div>
    </div>

    <h3>2. 手動關節角度</h3>
    <div id="sliders"></div>
    <div class="row"><button id="zeroBtn" class="ghost">全部歸零(升降模組回最高點)</button></div>

    <h3>3. 目前狀態(正向運動學)</h3>
    <div id="readout"></div>

    <h3>4. 逆向運動學(DLS 數值解)</h3>
    <div class="note">Z 為離地高度(= 數學座標 + 215)。如果這個組法沒辦法同時控制位置和方向,會自動改成「位置優先、方向盡量接近」,並顯示方向差了幾度。</div>
    <div id="dofInfo" class="note" style="margin-top:4px;"></div>
    <div class="grid3" style="margin:6px 0;">
        <label>X<input id="ikX" type="number" value="300"></label>
        <label>Y<input id="ikY" type="number" value="0"></label>
        <label>Z(離地)<input id="ikZ" type="number" value="500"></label>
    </div>
    <div class="row"><label><input id="useDir" type="checkbox" checked> 指定方向</label></div>
    <div class="grid3" id="dirInputs">
        <label>dx<input id="dX" type="number" value="1" step="0.1"></label>
        <label>dy<input id="dY" type="number" value="0" step="0.1"></label>
        <label>dz<input id="dZ" type="number" value="0" step="0.1"></label>
    </div>
    <div class="row" style="margin-top:6px;"><button id="ikBtn">求解並套用</button><button id="ikFromTip" class="ghost">目標=目前末端</button></div>
    <div id="ikResult"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="modular_kinematics.js"></script>
<script>
const Z_GROUND = PART_LIBRARY.base.groundHeight;

// ---------- 狀態 ----------
let assembly = JSON.parse(JSON.stringify(CURRENT_ARM_ASSEMBLY));
let thetas = jointInfo(assembly).map(j => j.home);
let ikTarget = null;

// ---------- 3D 場景(直接用 Z 朝上的世界座標) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11111b);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
camera.up.set(0, 0, 1);
camera.position.set(900, -900, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 200);
controls.update();
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(500, -700, 1200); scene.add(sun);

// 地板(離地 0 = 數學座標 -215)
const grid = new THREE.GridHelper(1400, 28, 0x585b70, 0x313244);
grid.rotation.x = Math.PI / 2; grid.position.z = -Z_GROUND; scene.add(grid);
// 世界座標軸(以底座插孔為原點): X紅 Y綠 Z藍
[[1,0,0,0xf38ba8],[0,1,0,0xa6e3a1],[0,0,1,0x89b4fa]].forEach(([x,y,z,c]) =>
    scene.add(new THREE.ArrowHelper(new THREE.Vector3(x,y,z), new THREE.Vector3(0,0,0), 160, c, 14, 8)));
// 底座圓柱
const baseGeo = new THREE.CylinderGeometry(70, 80, Z_GROUND, 32);
const baseMesh = new THREE.Mesh(baseGeo, new THREE.MeshPhongMaterial({ color: 0x585b70 }));
baseMesh.rotation.x = Math.PI / 2; baseMesh.position.z = -Z_GROUND / 2; scene.add(baseMesh);

const armGroup = new THREE.Group(); scene.add(armGroup);
const mat = {
    body: new THREE.MeshPhongMaterial({ color: 0xbac2de, transparent: true, opacity: 0.85 }),
    pivot: new THREE.MeshPhongMaterial({ color: 0x7f849c }),
    c: new THREE.MeshPhongMaterial({ color: 0xcba6f7 }),
    ee: new THREE.MeshPhongMaterial({ color: 0x94e2d5 }),
    m: new THREE.MeshPhongMaterial({ color: 0x9399b2 }),
    tip: new THREE.MeshPhongMaterial({ color: 0xf38ba8 }),
    target: new THREE.MeshPhongMaterial({ color: 0xfab387, transparent: true, opacity: 0.7 }),
};
function addRod(a, b, r, material) {
    const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
    const len = va.distanceTo(vb); if (len < 1e-6) return;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), material);
    m.position.copy(va).add(vb).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
    armGroup.add(m);
}
function toMatrix4(T) { const m = new THREE.Matrix4(); m.set(...T); return m; }

// ---------- 真實模型(STL) ----------
// PART_GEO 裡每個 piece 記錄:STL 檔名、R、o(STL座標 → 零件局部座標),在這裡事先把幾何轉好、快取起來
const stlLoader = new THREE.STLLoader();
const rawGeo = {}, pieceGeoCache = new Map();
const MODEL_FILES = [...new Set(JSON.stringify(PART_GEO).match(/"file":"[^"]+"/g).map(x => x.slice(8, -1)))];
let modelsLoaded = 0, modelsFailed = [];
MODEL_FILES.forEach(f => stlLoader.load(encodeURI('./' + f),
    g => { rawGeo[f] = g; modelsLoaded++; updateLoadInfo(); update(); },
    undefined,
    () => { modelsFailed.push(f); updateLoadInfo(); }));
function updateLoadInfo() {
    const el = document.getElementById('loadInfo');
    el.innerHTML = modelsLoaded === MODEL_FILES.length ? '' :
        `模型載入中 ${modelsLoaded}/${MODEL_FILES.length}` + (modelsFailed.length ? `<br><span class="bad">找不到:${modelsFailed.join('、')}(先用簡化外形顯示)</span>` : '');
}
function pieceGeo(piece) {
    if (!rawGeo[piece.file]) return null;
    if (pieceGeoCache.has(piece)) return pieceGeoCache.get(piece);
    const g = rawGeo[piece.file].clone();
    g.translate(-piece.o[0], -piece.o[1], -piece.o[2]);
    const R = piece.R, m = new THREE.Matrix4().set(R[0][0], R[0][1], R[0][2], 0, R[1][0], R[1][1], R[1][2], 0, R[2][0], R[2][1], R[2][2], 0, 0, 0, 0, 1);
    g.applyMatrix4(m);
    if (piece.shiftZ) g.translate(0, 0, piece.shiftZ);
    g.computeVertexNormals();
    pieceGeoCache.set(piece, g); return g;
}
const modelMat = {
    base: new THREE.MeshPhongMaterial({ color: 0x585b70 }),
    body: new THREE.MeshPhongMaterial({ color: 0xf9e2af }),
    pivot: new THREE.MeshPhongMaterial({ color: 0xa6adc8 }),
    conn: new THREE.MeshPhongMaterial({ color: 0xcba6f7 }),
    ee: new THREE.MeshPhongMaterial({ color: 0x94e2d5 }),
    lift: new THREE.MeshPhongMaterial({ color: 0x89b4fa }),
    gear: new THREE.MeshPhongMaterial({ color: 0x9399b2 }),
};
// 放一個 STL 零件:T = 零件座標系(4x4 row-major),extra = 額外的局部轉換(THREE.Matrix4,可省略)
function addPiece(piece, T, material, extra) {
    const g = pieceGeo(piece); if (!g) return false;
    const mesh = new THREE.Mesh(g, material);
    mesh.matrixAutoUpdate = false;
    mesh.matrix.copy(toMatrix4(T)); if (extra) mesh.matrix.multiply(extra);
    armGroup.add(mesh); return true;
}
function allModelsReady(pieces) { return pieces.every(p => rawGeo[p.file]); }

// 用真實模型畫手臂;某個零件的模型還沒載入時,回傳 false 讓呼叫端改畫簡化外形
function drawModels(fk) {
    let ri = 0, li = 0, ci = 0;
    assembly.parts.forEach(part => {
        if (part.kind === 'motor') {
            addPiece(PART_GEO.motor.pivot, fk.inputFrames[ri], modelMat.pivot);
            addPiece(PART_GEO.motor.body, fk.motorFrames[ri], modelMat.body);
            ri++;
        } else if (part.kind === 'linear') {
            const L = fk.linearFrames[li++], lib = PART_LIBRARY.linearModules[part.key];
            PART_GEO[part.key].pieces.forEach(pc => {
                let extra = null;
                if (pc.moving) extra = new THREE.Matrix4().makeTranslation(...lib.travelDir.map(v => v * L.d));
                if (pc.spin) {
                    const [cx, cy] = pc.spin.center, a = pc.spin.perMM * L.d;
                    extra = new THREE.Matrix4().makeTranslation(cx, cy, 0).multiply(new THREE.Matrix4().makeRotationZ(a)).multiply(new THREE.Matrix4().makeTranslation(-cx, -cy, 0));
                }
                addPiece(pc, L.Tin, pc.moving ? modelMat.conn : pc.spin ? modelMat.gear : modelMat.lift, extra);
            });
        } else {
            const T = fk.partFrames[ci++].T, geo = PART_GEO[part.key];
            if (geo) geo.pieces.forEach(pc => addPiece(pc, T, part.kind === 'ee' ? modelMat.ee : modelMat.conn));
        }
    });
}
const modelsWanted = () => document.getElementById('showModels').checked;
function modelsReadyFor() {
    const files = new Set(['底座成品2.stl', PART_GEO.motor.pivot.file, PART_GEO.motor.body.file]);
    assembly.parts.forEach(p => { if (p.kind !== 'motor' && PART_GEO[p.key]) PART_GEO[p.key].pieces.forEach(pc => files.add(pc.file)); });
    return [...files].every(f => rawGeo[f]);
}
// 碰撞盒顯示(線框):紅 = 正在碰撞的零件
const boxLineMat = new THREE.LineBasicMaterial({ color: 0x94e2d5, transparent: true, opacity: 0.6 });
const boxHitMat = new THREE.LineBasicMaterial({ color: 0xf38ba8 });
function drawBoxes(coll, all) {
    const hitNames = new Set(coll.hits.flatMap(h => [h.a, h.b]));
    coll.boxes.forEach(b => {
        const hit = hitNames.has(b.name);
        if (!all && !hit) return;
        const o = b.obb, geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(o.h[0] * 2, o.h[1] * 2, o.h[2] * 2));
        const line = new THREE.LineSegments(geo, hit ? boxHitMat : boxLineMat);
        line.matrixAutoUpdate = false;
        line.matrix.set(o.u[0][0], o.u[1][0], o.u[2][0], o.c[0], o.u[0][1], o.u[1][1], o.u[2][1], o.c[1], o.u[0][2], o.u[1][2], o.u[2][2], o.c[2], 0, 0, 0, 1);
        armGroup.add(line);
    });
}

function drawArm(fk) {
    while (armGroup.children.length) armGroup.remove(armGroup.children[0]);
    const useModels = modelsWanted() && modelsReadyFor();
    baseMesh.visible = !useModels;
    if (useModels) {
        addPiece(PART_GEO.base.pieces[0], mkIdentity(), modelMat.base);
        drawModels(fk);
        fk.motorFrames.forEach(Trot => armGroup.add(new THREE.ArrowHelper(new THREE.Vector3(Trot[2], Trot[6], Trot[10]), new THREE.Vector3(Trot[3], Trot[7], Trot[11]), 110, 0xf9e2af, 14, 8)));
    } else drawSchematic(fk);
    drawCommon(fk);
}
function drawSchematic(fk) {
    // 馬達:pivot(輸入→轉軸點)+ 以轉軸點為中心的80mm方塊(頂面、側面剛好在+40)
    fk.inputFrames.forEach((Tin, i) => {
        const Trot = fk.motorFrames[i];
        addRod([Tin[3], Tin[7], Tin[11]], [Trot[3], Trot[7], Trot[11]], 12, mat.pivot);
        const box = new THREE.Mesh(new THREE.BoxGeometry(80, 80, 80), mat.body);
        box.applyMatrix4(toMatrix4(Trot)); armGroup.add(box);
        box.add(new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color: 0x313244 })));
        // 標示側面(紅點)方便對照實體
        const mark = new THREE.Mesh(new THREE.SphereGeometry(7, 12, 12), new THREE.MeshPhongMaterial({ color: 0xf38ba8 }));
        mark.position.set(40, 0, 0); box.add(mark);
        // 轉軸方向
        const ax = new THREE.Vector3(Trot[2], Trot[6], Trot[10]);
        armGroup.add(new THREE.ArrowHelper(ax, new THREE.Vector3(Trot[3], Trot[7], Trot[11]), 110, 0xf9e2af, 14, 8));
    });
    // 直線模組:支架盒 + 齒輪A + 齒輪BC + 齒條 + 齒條末端插孔方塊(位置用 STL 量的,畫個大概)
    fk.linearFrames.forEach(L => {
        const T = toMatrix4(L.Tin), d = L.d, lib = PART_LIBRARY.linearModules[L.key];
        const addLocal = (geo, pos, mat, rotX) => { const m = new THREE.Mesh(geo, mat); if (rotX) m.rotation.x = rotX; m.position.set(...pos); const g = new THREE.Group(); g.add(m); g.applyMatrix4(T); armGroup.add(g); return m; };
        addLocal(new THREE.BoxGeometry(78, 78, 50), [0, 0, 30], mat.body);                                  // 支架盒(內含馬達)
        addLocal(new THREE.CylinderGeometry(38.75, 38.75, 10, 40), [0, 0, 73], mat.pivot, Math.PI / 2);      // 齒輪A
        addLocal(new THREE.CylinderGeometry(23.75, 23.75, 28, 32), [-50, 0, 81], mat.pivot, Math.PI / 2);    // 齒輪BC
        addLocal(new THREE.BoxGeometry(5, lib.rackLength, 15), [-78.35, -21 + lib.rackLength / 2 - d, 86.9], mat.c); // 齒條
        addLocal(new THREE.BoxGeometry(57.5, 28, 57.5), [-137.25, 3.5 - d, 86.35], mat.c);                  // 齒條末端方塊
        addLocal(new THREE.BoxGeometry(70, 8, 8), [-100, 0, 86.35], mat.c);                                  // 支架手臂(示意)
    });
    // 連接件與末端:骨架線
    const sk = fk.skeleton;
    for (let k = 1; k < sk.length; k++) {
        const o = sk[k].owner;
        if (sk[k - 1].owner !== o && !(o.startsWith('c') || o === 'ee')) continue;
        if (o.startsWith('c')) addRod(sk[k - 1].p, sk[k].p, 9, mat.c);
        else if (o === 'ee') addRod(sk[k - 1].p, sk[k].p, 7, mat.ee);
    }
}
function drawCommon(fk) {
    // 末端點與方向
    const tip = new THREE.Mesh(new THREE.SphereGeometry(9, 16, 16), mat.tip);
    tip.position.set(...fk.pos); armGroup.add(tip);
    armGroup.add(new THREE.ArrowHelper(new THREE.Vector3(...fk.dir), new THREE.Vector3(...fk.pos), 80, 0xf38ba8, 14, 8));
    // 下一個零件會接的位置:橘色圓環 + 插入方向箭頭
    if (fk.openSocket) {
        const S = fk.openSocket;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(22, 3.5, 10, 32), new THREE.MeshPhongMaterial({ color: 0xfab387 }));
        ring.applyMatrix4(toMatrix4(S)); armGroup.add(ring);
        armGroup.add(new THREE.ArrowHelper(new THREE.Vector3(S[2], S[6], S[10]), new THREE.Vector3(S[3], S[7], S[11]), 70, 0xfab387, 16, 10));
    }
    if (ikTarget) {
        const t = new THREE.Mesh(new THREE.SphereGeometry(13, 16, 16), mat.target);
        t.position.set(...ikTarget); armGroup.add(t);
    }
}

// ---------- 介面 ----------
const chainEl = document.getElementById('chain');
const slidersEl = document.getElementById('sliders');

function partName(part) {
    if (part.kind === 'motor') return PART_LIBRARY.motor.name;
    if (part.kind === 'linear') return PART_LIBRARY.linearModules[part.key].name;
    if (part.kind === 'ee') return PART_LIBRARY.endEffectors[part.key].name;
    return PART_LIBRARY.connectors[part.key].name;
}
// 零件在序列中的位置 → 它是第幾顆馬達(不是馬達則回傳 -1)
function motorIndexOf(pi) {
    if (!isJoint(assembly.parts[pi])) return -1;
    return assembly.parts.slice(0, pi).filter(isJoint).length;
}

function buildChain() {
    chainEl.innerHTML = '<div class="card base"><span class="idx">0</span><span class="name">底座</span></div>';
    assembly.parts.forEach((part, pi) => {
        const card = document.createElement('div'); card.className = 'card';
        const mi = motorIndexOf(pi);
        const tag = isJoint(part) ? `<span class="tag m">馬達${mi + 1}</span>` : part.kind === 'ee' ? '<span class="tag e">末端</span>' : '<span class="tag c">連接件</span>';
        card.innerHTML = `<span class="idx">${pi + 1}</span><span class="name">${tag}${partName(part)}</span>`;
        if (part.kind === 'motor') {
            const fs = document.createElement('select');
            fs.title = '下一個零件接在這顆馬達的哪一面';
            Object.entries(PART_LIBRARY.motor.faces).forEach(([k, v]) => fs.add(new Option(`往下接${v.name}`, k)));
            fs.value = part.face;
            fs.onchange = () => { part.face = +fs.value; updateDOF(); update(); };
            card.appendChild(fs);
        }
        const x = document.createElement('button'); x.className = 'x'; x.innerText = '✕'; x.title = '拿掉這個零件';
        x.onclick = () => {
            if (isJoint(part)) thetas.splice(mi, 1);
            assembly.parts.splice(pi, 1);
            refreshAll();
        };
        card.appendChild(x);
        chainEl.appendChild(card);
    });
    buildNextBox();
}

function buildNextBox() {
    const hint = document.getElementById('nextHint'), btns = document.getElementById('nextBtns');
    btns.innerHTML = '';
    const last = assembly.parts[assembly.parts.length - 1];
    if (last && last.kind === 'ee') {
        hint.innerHTML = '✔ 已接上末端,組裝完成。要繼續改,先按末端旁的 ✕ 拿掉它。';
        return;
    }
    let where = '底座插孔';
    if (last && last.kind === 'motor') where = `馬達${motorCount(assembly)} 的${PART_LIBRARY.motor.faces[last.face].name}`;
    else if (last && last.kind === 'linear') where = `${partName(last)} 的齒條插孔`;
    else if (last) where = `${partName(last)} 的出口`;
    hint.innerHTML = `下一個要接什麼?(接在 <b>${where}</b>)`;
    const add = (part, label) => {
        const b = document.createElement('button'); b.className = 'ghost'; b.innerText = label;
        b.disabled = !canAppend(assembly, part);
        if (isJoint(part) && b.disabled) b.innerText += `(已達${MAX_MOTORS}顆)`;
        b.onclick = () => {
            assembly.parts.push(part);
            if (part.kind === 'motor') thetas.push(0);
            if (part.kind === 'linear') thetas.push(PART_LIBRARY.linearModules[part.key].homeAngle);
            refreshAll();
        };
        btns.appendChild(b);
    };
    add({ kind: 'motor', face: 0 }, '+ 馬達模組');
    Object.entries(PART_LIBRARY.connectors).forEach(([k, v]) => { if (k !== 'direct') add({ kind: 'connector', key: k }, '+ ' + v.name); });
    Object.entries(PART_LIBRARY.linearModules).forEach(([k, v]) => add({ kind: 'linear', key: k }, '+ ' + v.name));
    Object.entries(PART_LIBRARY.endEffectors).forEach(([k, v]) => { if (k !== 'none') add({ kind: 'ee', key: k }, '+ ' + v.name + '(結束)'); });
}

function buildSliders() {
    slidersEl.innerHTML = thetas.length ? '' : '<div class="note">還沒有馬達</div>';
    const info = jointInfo(assembly);
    thetas.forEach((_, i) => {
        const j = info[i], w = document.createElement('div'); w.className = 'slider';
        const label = j.kind === 'linear' ? `馬達${i + 1}(${PART_LIBRARY.linearModules[j.key].name})` : `馬達${i + 1}`;
        w.innerHTML = `<div class="lbl"><span>${label}</span><span id="sv${i}"></span></div>
                       <input id="s${i}" type="range" min="${j.limit[0]}" max="${j.limit[1]}" step="1" value="${thetas[i]}">`;
        slidersEl.appendChild(w);
        w.querySelector('input').oninput = e => { thetas[i] = +e.target.value; update(); };
    });
    syncSliders();
}
function syncSliders() {
    thetas.forEach((t, i) => {
        const s = document.getElementById('s' + i), v = document.getElementById('sv' + i);
        if (s) s.value = t;
        if (v) { const j = jointInfo(assembly)[i];
            v.innerText = j && j.kind === 'linear' ? `${t.toFixed(1)}°  → 下降 ${linearDisplacement(j.key, t).toFixed(1)} mm` : t.toFixed(1) + '°'; }
    });
}
let currentDOF = { motors: 0, posDOF: 0, dirDOF: 0, fullControl: false };
function updateDOF() {
    currentDOF = analyzeDOF(assembly);
    const d = currentDOF, el = document.getElementById('dofInfo');
    if (!d.motors) { el.innerHTML = ''; return; }
    const lost = d.motors - d.posDOF - d.dirDOF;
    el.innerHTML = `自由度分析:馬達 ${d.motors} 顆 → 位置 <b>${d.posDOF}</b> 個、方向 <b>${d.dirDOF}</b> 個` +
        (lost > 0 ? `(有 ${lost} 顆的效果跟別顆重疊,例如轉軸共線)` : '') + '<br>' +
        (d.fullControl ? '<span class="ok">✔ 可以同時控制位置和方向</span>'
         : d.posDOF < 3 ? '<span class="bad">位置只能在一個曲面/曲線上移動,很多點到不了;方向不能指定</span>'
         : d.dirDOF === 0 ? '<span class="bad">只能控制位置,方向完全由位置決定</span>'
         : '<span class="bad">位置可控,方向只能調整一部分(通常是仰角),只能盡量接近</span>');
}
function refreshAll() { ikTarget = null; buildChain(); buildSliders(); updateDOF(); update(); }

document.getElementById('presetScara').onclick = () => {
    assembly = JSON.parse(JSON.stringify(SCARA_ASSEMBLY));
    thetas = jointInfo(assembly).map(j => j.home);
    refreshAll();
    // SCARA 夾爪固定朝下:IK 預設改成不指定方向
    document.getElementById('useDir').checked = false; document.getElementById('useDir').onchange();
};
document.getElementById('presetCurrent').onclick = () => {
    assembly = JSON.parse(JSON.stringify(CURRENT_ARM_ASSEMBLY));
    thetas = jointInfo(assembly).map(j => j.home);
    refreshAll();
};
document.getElementById('clearBtn').onclick = () => { assembly = { parts: [] }; thetas = []; refreshAll(); };
document.getElementById('zeroBtn').onclick = () => { thetas = jointInfo(assembly).map(j => j.home); syncSliders(); update(); };

const f1 = v => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);
const f3 = v => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3);
let lastColl = null;
function update() {
    const fk = modularFK(assembly, thetas);
    drawArm(fk);
    const coll = modularCollision(assembly, thetas, { fk }); lastColl = coll;
    drawBoxes(coll, document.getElementById('showBoxes').checked);
    const badge = document.getElementById('collBadge');
    badge.className = coll.collided ? 'hit' : 'safe';
    badge.innerText = coll.collided ? '⚠ 碰撞:' + coll.hits.slice(0, 3).map(h => h.a + ' ↔ ' + h.b).join('、') + (coll.hits.length > 3 ? ' …' : '') : '✔ 無碰撞';
    let s = `末端 (離地)  X ${f1(fk.pos[0])}  Y ${f1(fk.pos[1])}  Z ${f1(fk.pos[2] + Z_GROUND)}\n`;
    s += `末端方向    (${fk.dir.map(f3).join(', ')})\n\n`;
    s += `關節(數學座標):\n`;
    const rows = [];
    fk.motorFrames.forEach((T, k) => rows[fk.motorFrameJoint[k]] = `M${fk.motorFrameJoint[k] + 1} 轉軸點 (${f1(T[3])}, ${f1(T[7])}, ${f1(T[11])})  軸(${[T[2], T[6], T[10]].map(v => f1(v)).join(',')})`);
    fk.linearFrames.forEach(L => { const B = L.Tblock;
        rows[L.motorIndex] = `M${L.motorIndex + 1} 升降 下降 ${f1(L.d)} mm,插孔 (${f1(B[3])}, ${f1(B[7])}, ${f1(B[11])}) 開口(${[B[2], B[6], B[10]].map(v => f1(v)).join(',')})`; });
    s += rows.join('\n') + '\n';
    document.getElementById('readout').innerText = s;
    syncSliders();
}

// ---------- IK ----------
const useDir = document.getElementById('useDir');
useDir.onchange = () => document.getElementById('dirInputs').style.opacity = useDir.checked ? 1 : 0.4;
document.getElementById('ikFromTip').onclick = () => {
    const fk = modularFK(assembly, thetas);
    ['ikX', 'ikY'].forEach((id, k) => document.getElementById(id).value = fk.pos[k].toFixed(1));
    document.getElementById('ikZ').value = (fk.pos[2] + Z_GROUND).toFixed(1);
    ['dX', 'dY', 'dZ'].forEach((id, k) => document.getElementById(id).value = fk.dir[k].toFixed(3));
};
document.getElementById('ikBtn').onclick = () => {
    if (!motorCount(assembly)) { document.getElementById('ikResult').innerHTML = '<span class="bad">還沒有馬達,無法求解</span>'; return; }
    const v = id => +document.getElementById(id).value;
    const pos = [v("ikX"), v("ikY"), v("ikZ") - Z_GROUND];
    const dir = useDir.checked ? [v("dX"), v("dY"), v("dZ")] : null;
    ikTarget = pos;
    const t0 = performance.now();
    const r = modularIK(assembly, pos, dir, { warmStart: thetas, dof: currentDOF });
    const ms = performance.now() - t0;
    const el = document.getElementById('ikResult');
    const fk = modularFK(assembly, r.thetas);
    const pErr = Math.hypot(...fk.pos.map((v, k) => v - pos[k]));
    const MODE = { 'position': '只求位置', 'position+direction': '位置+方向 都達成', 'position-priority': '位置優先,方向盡量接近' };
    let s = `<span class="${r.converged ? 'ok' : 'bad'}">${r.converged ? '✔ 位置到達' : '✘ 位置到不了(顯示最接近的姿態)'}</span>\n`;
    s += `模式 ${MODE[r.mode] || r.mode}\n`;
    s += `位置誤差 ${pErr.toFixed(2)} mm\n`;
    if (dir) {
        const de = r.dirErrDeg;
        s += `<span class="${de < 0.5 ? 'ok' : 'bad'}">方向誤差 ${de.toFixed(2)}°</span>${r.mode === 'position-priority' && de >= 0.5 ? (currentDOF.fullControl ? '(這個方向在這個位置到不了)' : '(這個組法的自由度不夠,無法完全對準)') : ''}\n`;
    }
    if (r.collided) s += `<span class="bad">⚠ 找不到不會碰撞的解,目前顯示的姿態會碰撞:${(r.hits || []).slice(0, 3).map(h => h.a + '↔' + h.b).join('、')}</span>\n`;
    else s += `<span class="ok">✔ 無碰撞</span>\n`;
    s += `迭代 ${r.iterations} 次,耗時 ${ms.toFixed(0)} ms\n`;
    s += `角度 [${r.thetas.map(v => v.toFixed(1)).join(', ')}]`;
    el.innerHTML = s;
    thetas = r.thetas.slice();
    update();
};

document.getElementById('showModels').onchange = () => update();
document.getElementById('showBoxes').onchange = () => update();
document.getElementById('toggle').onclick = () => document.getElementById('panel').classList.toggle('hidden');
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

refreshAll();
</script>
</body>
</html>
